[package]
name = "photocraft"
version = "0.1.0"
edition = "2021"
description = "Open-source Photoshop alternative — Rust + egui raster image editor with PSD support"
license = "MIT"
authors = ["MD. RaKib Hassan Dipu <rakibdipu@github.com>"]

[dependencies]
eframe = "0.29"
egui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
